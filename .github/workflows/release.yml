name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Check release metadata
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseMetadata.ps1 -Version $env:VERSION -NotesPath release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: dotnet test StroopApp.XUnitTests/StroopApp.XUnitTests.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish StroopApp/StroopApp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          --output ./publish

      - name: Zip artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath StroopApp-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StroopApp-${{ github.ref_name }}-win-x64.zip
          body_path: release-notes.md
          generate_release_notes: true
